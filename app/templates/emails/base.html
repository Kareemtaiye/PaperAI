<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
      }
      .header {
        background: #0f172a;
        padding: 32px;
        text-align: center;
      }
      .header h1 {
        color: #fff;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      .body {
        padding: 40px 32px;
        color: #374151;
        line-height: 1.6;
      }
      .field {
        margin: 16px 0;
        padding: 12px 16px;
        background: #f9fafb;
        border-left: 3px solid #6366f1;
        border-radius: 0 4px 4px 0;
      }
      .field-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        margin-bottom: 4px;
      }
      .field-value {
        font-size: 15px;
        color: #111827;
        font-weight: 500;
      }
      .btn {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        background: #6366f1;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      .footer {
        padding: 24px 32px;
        background: #f9fafb;
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
        border-top: 1px solid #e5e7eb;
      }
      .chip-green {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 600;
      }
      .chip-red {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>PaperAI</h1></div>
      <div class="body">{% block content %}{% endblock %}</div>
      <div class="footer">
        <p>You're receiving this because you have a PaperAI account.</p>
        <p>© 2026 PaperAI. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
